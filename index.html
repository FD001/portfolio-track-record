<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skin In The Game's Track Record</title>
<meta name="description" content="Public track record of stock picks — dates, entries, and current status.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="page-header">
    <h1>Skin In The Game's Track Record</h1>
    <p class="subtitle">We started this blog on 1st Jan 2025. Since then we have had hits and misses. All of them have been made public here. This is our record. Feel free to judge us. We don't mind.</p>
  </header>

  <div class="controls">
    <input id="search-input" type="search" placeholder="Search…" aria-label="Search picks">
    <select id="status-filter" aria-label="Filter by status" hidden>
      <option value="all">All statuses</option>
    </select>
    <span id="result-count" class="result-count"></span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <p id="status-message" class="status-message" hidden></p>

  <footer class="page-footer">
    <span id="last-updated"></span>
  </footer>

</div>
<script src="app.js" defer></script>
</body>
</html>
