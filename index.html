<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Record</title>
<meta name="description" content="Public track record of stock picks — dates, entries, and current status.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="page-header">
    <h1>Track Record</h1>
    <p class="subtitle">A public log of stock picks — dates, entries, and current status. Data is maintained live in a spreadsheet; this page always reflects the latest version.</p>
  </header>

  <div class="controls">
    <input id="search-input" type="search" placeholder="Search…" aria-label="Search picks">
    <select id="status-filter" aria-label="Filter by status" hidden>
      <option value="all">All statuses</option>
    </select>
    <span id="result-count" class="result-count"></span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead id="table-head"></thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <p id="status-message" class="status-message" hidden></p>

  <footer class="page-footer">
    <span id="last-updated"></span>
  </footer>

</div>
<script src="app.js" defer></script>
</body>
</html>
